<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#050a10;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#020609;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f3ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0080ff;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Hexagonal background -->
  <polygon points="32,2 58,16 58,48 32,62 6,48 6,16"
    fill="url(#bgGrad)"
    stroke="#00f3ff"
    stroke-width="1.5"
    opacity="0.9"
    filter="url(#glow)" />

  <!-- Inner hex subtle border -->
  <polygon points="32,7 53,19 53,45 32,57 11,45 11,19"
    fill="none"
    stroke="#00f3ff"
    stroke-width="0.4"
    opacity="0.3" />

  <!-- Circuit trace — top left -->
  <line x1="11" y1="24" x2="18" y2="24" stroke="#00f3ff" stroke-width="0.6" opacity="0.5"/>
  <circle cx="18" cy="24" r="1" fill="#00f3ff" opacity="0.6"/>

  <!-- Circuit trace — bottom right -->
  <line x1="46" y1="40" x2="53" y2="40" stroke="#00f3ff" stroke-width="0.6" opacity="0.5"/>
  <circle cx="46" cy="40" r="1" fill="#00f3ff" opacity="0.6"/>

  <!-- Dot accents at corners -->
  <circle cx="32" cy="4"  r="1.2" fill="#00f3ff" opacity="0.7"/>
  <circle cx="32" cy="60" r="1.2" fill="#00f3ff" opacity="0.7"/>

  <!-- Bold "B" letter -->
  <text
    x="32"
    y="44"
    font-family="'Courier New', Courier, monospace"
    font-weight="900"
    font-size="36"
    text-anchor="middle"
    fill="url(#cyanGrad)"
    filter="url(#glow)"
    letter-spacing="-1">B</text>

  <!-- Underline accent bar -->
  <rect x="20" y="47" width="24" height="1.5" rx="1"
    fill="#00f3ff" opacity="0.5"/>
</svg>
